name: D06 Luther

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (delta)'
        required: true
        default: 'delta'

permissions:
  contents: write

jobs:
  d06:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run D-F06 Luther
        run: |
          cd delta/F06_LUTHER/CODEBASE
          python3 omnis_d06_luther.py \
            --input ../IN/ \
            --output ../OUT/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d06-output
          path: delta/F06_LUTHER/OUT/

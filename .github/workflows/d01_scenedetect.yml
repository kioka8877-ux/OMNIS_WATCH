name: D01 Scene Detect

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (delta)'
        required: true
        default: 'delta'
      d00_run_id:
        description: 'D00 run ID for artifact download'
        required: true

permissions:
  contents: write

jobs:
  d01-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download D00 artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: d00_ingest.yml
          run_id: ${{ github.event.inputs.d00_run_id }}
          name: d00-output
          path: delta/F01_SCENE_DETECT/IN/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install scenedetect[opencv] opencv-python-headless

      - name: Run D-F01 Scene Detect
        run: |
          cd delta/F01_SCENE_DETECT/CODEBASE
          python3 omnis_d01_scenedetect.py \
            --input ../IN/ \
            --output ../OUT/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d01-scenes-output
          path: delta/F01_SCENE_DETECT/OUT/

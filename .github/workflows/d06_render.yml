# D06 RENDER — Remotion + Mixer per clip
name: D06 Render

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (delta)'
        required: true
        default: 'delta'
      num_clips:
        description: 'Number of clips'
        required: true
        default: '3'
      d05_run_id:
        description: 'D05 Preview run ID (for codex_STYLE.json)'
        required: false
      d04_run_id:
        description: 'D04 Timing run ID (for timing_*.json)'
        required: false
      release_tag:
        description: 'Release des clips reframes (d03-reframe-v2)'
        required: false
        default: 'd03-reframe-v2'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        clip_index: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create directories
        run: |
          mkdir -p delta/F06_RENDER/IN
          mkdir -p delta/F06_RENDER/OUT
          mkdir -p delta/F06_RENDER/F03A_REMOTION/CODEBASE/public
          mkdir -p delta/F06_RENDER/F03A_REMOTION/CODEBASE/OUT
          mkdir -p delta/F06_RENDER/F03B_MIXER/CODEBASE/IN
          mkdir -p delta/F06_RENDER/F03B_MIXER/CODEBASE/OUT

      # ============================================================
      # Telecharger le clip reframe depuis le release
      # ============================================================
      - name: Download clip ${{ matrix.clip_index }} from release
        run: |
          CLIP_IDX=${{ matrix.clip_index }}
          TAG=${{ inputs.release_tag }}
          curl -sL -o "delta/F06_RENDER/IN/clip_$(printf '%03d' $CLIP_IDX).mp4" \
            "https://github.com/kioka8877-ux/OMNIS_WATCH/releases/download/${TAG}/clip_$(printf '%03d' $CLIP_IDX).mp4"
          ls -la delta/F06_RENDER/IN/clip_$(printf '%03d' $CLIP_IDX).mp4

      # ============================================================
      # Telecharger artifacts precedents (si disponibles)
      # ============================================================
      - name: Download D04 Timing artifact
        if: inputs.d04_run_id != ''
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: d04_timing.yml
          run_id: ${{ inputs.d04_run_id }}
          name: d04-output
          path: delta/F06_RENDER/IN/

      # ============================================================
      # GENERER CODEX_CLIP pour ce clip (merge style + timing)
      # ============================================================
      - name: Merge codex for clip ${{ matrix.clip_index }}
        run: |
          CLIP_IDX=${{ matrix.clip_index }}
          
          # Si pas d'artifact, creer codex_STYLE par defaut
          if [ ! -f "delta/F06_RENDER/IN/codex_STYLE.json" ]; then
            echo '{"version":"2.0","emotion_mode":"WHOLESOME","color_preset":"warm_vibrant","enhance_4k":true,"sharpening":80,"vignette":0.25,"grain_intensity":0.2,"text_defaults":{"font":"Anton, Arial Black, sans-serif","size":96,"color":"#FFFFFF"},"zoom":{"min_scale":1.0,"max_scale":1.3,"on_strong_word":true}}' > delta/F06_RENDER/IN/codex_STYLE.json
          fi
          
          # Si pas de timing, prendre le timing commité dans le repo (D04 OUT) ou creer timing par defaut
          if [ ! -f "delta/F06_RENDER/IN/timing_$(printf '%03d' $CLIP_IDX).json" ]; then
            if [ -f "delta/F04_TIMING/OUT/timing_$(printf '%03d' $CLIP_IDX).json" ]; then
              cp delta/F04_TIMING/OUT/timing_$(printf '%03d' $CLIP_IDX).json delta/F06_RENDER/IN/
              echo "Timing copie depuis F04_TIMING/OUT (commit repo)"
            else
              echo "{\"clip_index\":$CLIP_IDX,\"words\":[{\"word\":\"test\",\"start\":0,\"end\":1}]}" > delta/F06_RENDER/IN/timing_$(printf '%03d' $CLIP_IDX).json
            fi
          fi
          
          # Merger
          cd delta/F06_RENDER/CODEBASE
          python3 merge_codex.py \
            --style ../IN/codex_STYLE.json \
            --timing ../IN/timing_$(printf '%03d' $CLIP_IDX).json \
            --clip-id $CLIP_IDX \
            --output ../OUT/codex_clip_$(printf '%03d' $CLIP_IDX).json
          
          echo "Merged codex for clip $CLIP_IDX"

      # ============================================================
      # F03A REMOTION - Render avec le codex genere
      # ============================================================
      - name: Prepare F03A inputs (video + codex)
        run: |
          CLIP_IDX=${{ matrix.clip_index }}
          # La video du clip devient video_coupee.mp4 (source Remotion)
          cp delta/F06_RENDER/IN/clip_$(printf '%03d' $CLIP_IDX).mp4 \
             delta/F06_RENDER/F03A_REMOTION/CODEBASE/public/video_coupee.mp4
          # Le codex merge doit etre INJECTE dans src/codexData.js (le composant importe ce module,
          # pas public/codex.json qui n'est jamais lu)
          python3 -c "import json; c=json.load(open('delta/F06_RENDER/OUT/codex_clip_%03d.json' % $CLIP_IDX)); open('delta/F06_RENDER/F03A_REMOTION/CODEBASE/src/codexData.js','w').write('export const codex = '+json.dumps(c,ensure_ascii=False,indent=2)+';\\n')"
          # Copie de secours aussi vers public/codex.json (compatibilité)
          cp delta/F06_RENDER/OUT/codex_clip_$(printf '%03d' $CLIP_IDX).json \
             delta/F06_RENDER/F03A_REMOTION/CODEBASE/public/codex.json

      - name: Install F03A dependencies
        run: |
          cd delta/F06_RENDER/F03A_REMOTION/CODEBASE
          npm install

      - name: Render F03A (clip ${{ matrix.clip_index }})
        run: |
          cd delta/F06_RENDER/F03A_REMOTION/CODEBASE
          
          FPS=$(python3 -c "import json; print(json.load(open('public/codex.json'))['video']['fps'])" 2>/dev/null || echo "30")
          FRAMES=$(python3 -c "import json; print(json.load(open('public/codex.json'))['video']['total_frames'])" 2>/dev/null || echo "150")
          
          echo "Rendering clip ${{ matrix.clip_index }}: ${FRAMES} frames @ ${FPS}fps"
          
          npx remotion render src/index.jsx OmniComposition \
            OUT/video_visuelle.mp4 \
            --codec h264 \
            --image-format jpeg \
            --concurrency 1

      # ============================================================
      # F03B MIXER - Ajouter SFX
      # ============================================================
      - name: Mix SFX F03B (clip ${{ matrix.clip_index }})
        run: |
          # Copier video vers F03B
          if [ -f "delta/F06_RENDER/F03A_REMOTION/CODEBASE/OUT/video_visuelle.mp4" ]; then
            cp delta/F06_RENDER/F03A_REMOTION/CODEBASE/OUT/video_visuelle.mp4 \
               delta/F06_RENDER/F03B_MIXER/CODEBASE/IN/video_visuelle.mp4
            cp delta/F06_RENDER/OUT/codex_clip_$(printf '%03d' ${{ matrix.clip_index }}).json \
               delta/F06_RENDER/F03B_MIXER/CODEBASE/IN/codex.json
            
            cd delta/F06_RENDER/F03B_MIXER/CODEBASE
            python3 omnis_f03b_mixer.py \
              --input IN/ \
              --output OUT/ \
              --sfx-dir ../../../SHARED/IN/sfx/
          else
            echo "No video to mix, creating placeholder"
            echo "placeholder" > delta/F06_RENDER/F03B_MIXER/CODEBASE/OUT/video_complete.mp4
          fi

      - name: Upload clip ${{ matrix.clip_index }}
        uses: actions/upload-artifact@v4
        with:
          name: d06-clip-${{ matrix.clip_index }}
          path: |
            delta/F06_RENDER/OUT/codex_clip_$(printf '%03d' ${{ matrix.clip_index }}).json
            delta/F06_RENDER/F03B_MIXER/CODEBASE/OUT/video_complete.mp4

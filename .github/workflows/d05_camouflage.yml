name: D05 Camouflage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (delta)'
        required: true
        default: 'delta'

permissions:
  contents: write

jobs:
  d05:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run D-F05 Camouflage
        run: |
          cd delta/F05_CAMOUFLAGE/CODEBASE
          python3 omnis_d05_camouflage.py \
            --input ../IN/ \
            --output ../OUT/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d05-output
          path: delta/F05_CAMOUFLAGE/OUT/

name: D04 Assembly

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (delta)'
        required: true
        default: 'delta'

permissions:
  contents: write

jobs:
  d04:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run D-F04 Assembly
        run: |
          cd delta/F04_ASSEMBLY/CODEBASE
          python3 omnis_d04_assembly.py \
            --input ../IN/ \
            --output ../OUT/ \
            --sfx-dir ../../../SHARED/IN/sfx/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d04-output
          path: delta/F04_ASSEMBLY/OUT/

name: DELTA Orchestrator

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Gate (G1|G2|G3|G4|G5|CLOSE)'
        required: true
        default: 'G2'
      title:
        description: 'Production title (G1 only)'
        required: false
      url:
        description: 'YouTube URL (G1 only, optional)'
        required: false
      clip_count:
        description: 'Nombre de clips 1-10 (G3 only)'
        required: false
        default: '3'
      clip_max_duration:
        description: 'Duree max par clip en secondes 10-60 (G3 only)'
        required: false
        default: '30'

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install global deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests

      - name: G1 - Ingest
        if: github.event.inputs.gate == 'G1'
        run: |
          cd delta/F00_INGEST/CODEBASE
          URL="${{ github.event.inputs.url }}"
          if [ -n "$URL" ]; then
            pip install yt-dlp
            python3 omnis_d00_ingest.py --url "$URL" --output ../OUT/
          elif [ -f "../IN/video_source.mp4" ]; then
            python3 omnis_d00_ingest.py --file "../IN/video_source.mp4" --output ../OUT/
          else
            echo "ERREUR: ni URL ni video_source.mp4 dans F00_INGEST/IN/"
            exit 1
          fi
          echo "G1_DONE=true" >> $GITHUB_ENV

      - name: Upload G1 artifact
        if: github.event.inputs.gate == 'G1'
        uses: actions/upload-artifact@v4
        with:
          name: d00-output
          path: delta/F00_INGEST/OUT/

      - name: G2 - Scene Detect + Transcribe
        if: github.event.inputs.gate == 'G2'
        run: |
          mkdir -p delta/F01_SCENE_DETECT/IN
          pip install requests -q
          python3 delta/_tools/download_artifact.py \
            "${{ secrets.GITHUB_TOKEN }}" \
            d00_ingest.yml \
            d00-output \
            delta/F01_SCENE_DETECT/IN/ \
            delta-dev
          ls -la delta/F01_SCENE_DETECT/IN/

      - name: G2 - Run Scene Detect
        if: ${{ github.event.inputs.gate == 'G2' }}
        run: |
          pip install scenedetect[opencv] opencv-python-headless
          cd delta/F01_SCENE_DETECT/CODEBASE
          python3 omnis_d01_scenedetect.py --input ../IN/ --output ../OUT/

      - name: G2 - Run Transcribe
        if: ${{ github.event.inputs.gate == 'G2' }}
        run: |
          pip install faster-whisper
          cd delta/F01_SCENE_DETECT/CODEBASE
          python3 omnis_d01_transcribe.py --input ../IN/ --output ../OUT/

      - name: Upload G2 artifacts
        if: ${{ github.event.inputs.gate == 'G2' }}
        uses: actions/upload-artifact@v4
        with:
          name: d01-scenes-output
          path: delta/F01_SCENE_DETECT/OUT/scenes.json
      - name: Upload G2 transcript
        if: ${{ github.event.inputs.gate == 'G2' }}
        uses: actions/upload-artifact@v4
        with:
          name: d01-transcript-output
          path: delta/F01_SCENE_DETECT/OUT/transcript.json

      - name: G3 - Viral Cut (Oracle)
        if: github.event.inputs.gate == 'G3'
        env:
          CLIP_COUNT: ${{ github.event.inputs.clip_count }}
          CLIP_MAX_DURATION: ${{ github.event.inputs.clip_max_duration }}
          ORACLE_BASE_URL: ${{ vars.ORACLE_BASE_URL }}
          ORACLE_MODEL: ${{ vars.ORACLE_MODEL }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
        run: |
          mkdir -p delta/F02_VIRAL_CUT/IN
          pip install requests -q
          python3 delta/_tools/download_artifact.py \
            "${{ secrets.GITHUB_TOKEN }}" \
            delta_orchestrator.yml \
            d01-scenes-output \
            delta/F02_VIRAL_CUT/IN/ \
            main
          python3 delta/_tools/download_artifact.py \
            "${{ secrets.GITHUB_TOKEN }}" \
            delta_orchestrator.yml \
            d01-transcript-output \
            delta/F02_VIRAL_CUT/IN/ \
            main
          ls -la delta/F02_VIRAL_CUT/IN/
          cd delta/F02_VIRAL_CUT/CODEBASE
          python3 omnis_d02_viralcut.py --input ../IN/ --output ../OUT/ \
            --clip-count "$CLIP_COUNT" --clip-max-duration "$CLIP_MAX_DURATION" \
            --oracle

      - name: Upload G3 artifact
        if: ${{ github.event.inputs.gate == 'G3' }}
        uses: actions/upload-artifact@v4
        with:
          name: d02-cutlist-output
          path: delta/F02_VIRAL_CUT/OUT/

      - name: G4 - Reframe
        if: ${{ github.event.inputs.gate == 'G4' }}
        run: |
          mkdir -p delta/F03_REFRAME/IN
          cp delta/F00_INGEST/OUT/video_source.mp4 delta/F03_REFRAME/IN/ 2>/dev/null || \
            cp delta/F02_VIRAL_CUT/OUT/cutlist.json delta/F03_REFRAME/IN/ 2>/dev/null || true
          cd delta/F03_REFRAME/CODEBASE
          python3 omnis_d03_reframe.py --input ../IN/ --output ../OUT/

      - name: Upload G4 artifact
        if: ${{ github.event.inputs.gate == 'G4' }}
        uses: actions/upload-artifact@v4
        with:
          name: d03-output
          path: delta/F03_REFRAME/OUT/

      - name: G5 - Assembly + Camouflage + Luther
        if: ${{ github.event.inputs.gate == 'G5' }}
        run: |
          # Assembly
          mkdir -p delta/F04_ASSEMBLY/IN
          cp -r delta/F03_REFRAME/OUT/* delta/F04_ASSEMBLY/IN/ 2>/dev/null || true
          cd delta/F04_ASSEMBLY/CODEBASE
          python3 omnis_d04_assembly.py --input ../IN/ --output ../OUT/
          # Camouflage
          mkdir -p delta/F05_CAMOUFLAGE/IN
          cp -r delta/F04_ASSEMBLY/OUT/* delta/F05_CAMOUFLAGE/IN/ 2>/dev/null || true
          cd ../../delta/F05_CAMOUFLAGE/CODEBASE
          python3 omnis_d05_camouflage.py --input ../IN/ --output ../OUT/
          # Luther
          mkdir -p delta/F06_LUTHER/IN
          cp -r delta/F05_CAMOUFLAGE/OUT/* delta/F06_LUTHER/IN/ 2>/dev/null || true
          cd ../../delta/F06_LUTHER/CODEBASE
          python3 omnis_d06_luther.py --input ../IN/ --output ../OUT/

      - name: Upload G5 artifacts
        if: ${{ github.event.inputs.gate == 'G5' }}
        uses: actions/upload-artifact@v4
        with:
          name: d06-output
          path: delta/F06_LUTHER/OUT/

      - name: Ledger update
        run: python3 delta/_tools/update_ledger.py "${{ github.event.inputs.gate }}"
      - name: Commit ledger
        run: |
          git config user.name "delta-orchestrator"
          git config user.email "orchestrator@omnis-watch"
          git add delta/omnis_ledger.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "ledger: gate ${{ github.event.inputs.gate }} [skip ci]"
            git push
          fi

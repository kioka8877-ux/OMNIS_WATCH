name: D00 Ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (delta)'
        required: true
        default: 'delta'
      url:
        description: 'URL YouTube (optionnel - sinon prendre IN/video_source.mp4)'
        required: false

permissions:
  contents: write

jobs:
  d00:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg + yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Check for local video
        id: check_video
        run: |
          if [ -f "delta/F00_INGEST/IN/video_source.mp4" ]; then
            echo "local_video=true" >> $GITHUB_OUTPUT
            ls -la delta/F00_INGEST/IN/video_source.mp4
          else
            echo "local_video=false" >> $GITHUB_OUTPUT
          fi

      - name: Run D-F00 Ingest
        env:
          YT_DLP_EXTRACTOR_ARGS: "youtube:player_client=android"
        run: |
          cd delta/F00_INGEST/CODEBASE
          python3 omnis_d00_ingest.py \
            --url "${{ github.event.inputs.url }}" \
            --output ../OUT/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d00-output
          path: delta/F00_INGEST/OUT/

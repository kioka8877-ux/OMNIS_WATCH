# D05 PREVIEW — Build only (manual deployment)
name: D05 Preview

on:
  push:
    branches:
      - dev1
    paths:
      - 'delta/F05_PREVIEW/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: delta/F05_PREVIEW/package-lock.json

      - name: Install dependencies
        run: |
          cd delta/F05_PREVIEW
          npm install

      - name: Build
        run: |
          cd delta/F05_PREVIEW
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d05-preview-build
          path: delta/F05_PREVIEW/dist

# NOTE: Pour deployer manuellement sur GitHub Pages:
# 1. Aller dans Settings > Pages
# 2. Source: GitHub Actions
# 3. Le workflow "D05 Preview" genere le build
# 4. Telecharger l'artifact pour tester en local
